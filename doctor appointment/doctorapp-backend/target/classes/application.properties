# =============================================================================
# Nearby Doctor Appointment Platform - backend config
# This is a fully independent app: own port, own database, own JWT secret.
# It does NOT share a schema, port, or process with the EMS backend.
# =============================================================================

spring.application.name=doctor-appointment-platform

server.port=8082

# --- Database (separate schema from the EMS project) ---
spring.datasource.url=jdbc:mysql://localhost:3306/doctorapp_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
# Change this secret before any real deployment. Must be >= 256 bits for HS256.
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-before-deploying-doctorapp-32bytes}
app.jwt.access-token-expiry-ms=900000
# 15 minutes
app.jwt.refresh-token-expiry-ms=604800000
# 7 days

# --- CORS: the doctor-app frontend runs on a different port than the EMS frontend ---
app.frontend-url=http://localhost:5174

# --- Nearby search defaults ---
app.search.default-radius-km=5

# --- Default admin account (seeded on first startup if it doesn't exist) ---
# There is no public admin-registration endpoint by design. Log in with these
# credentials, then change the password (or override via env vars) before deploying.
app.admin.email=${ADMIN_EMAIL:admin@nearbycare.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# --- Logging ---
# Actual levels/appenders/rotation live in logback-spring.xml (writes to ./logs/,
# same convention as the EMS project). These two properties are kept only as a
# quick override point - logback-spring.xml is what actually creates the files.
logging.level.root=INFO
logging.level.com.doctorapp=DEBUG
