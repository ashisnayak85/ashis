# =============================================================================
# DEV PROFILE - only active when the app is started with -Dspring-boot.run.profiles=dev
# Points mail at a Mailtrap sandbox inbox: emails never leave Mailtrap, so you
# can test the whole "create user -> receive credentials" flow with zero cost
# and zero risk of mailing a real person.
#
# Get these values from mailtrap.io > Email Testing > your inbox > SMTP Settings.
# Set them as real environment variables - never hardcode them here.
# =============================================================================

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
