# =============================================================================
# PROD PROFILE - only active when the app is started with -Dspring-boot.run.profiles=prod
# Points mail at a real transactional email provider (Zoho ZeptoMail here) so
# actual employees receive real credentials/notifications - never point
# production traffic at the dev profile's Mailtrap sandbox, and never point
# local testing at this file.
#
# Every value below is pulled from an environment variable - nothing here is
# a real secret, so this file is safe to commit. Set the real values on
# whatever server/host actually runs this profile, never in this file.
# =============================================================================

spring.mail.host=smtp.zeptomail.com
spring.mail.port=587
spring.mail.username=emailapikey
spring.mail.password=${ZEPTOMAIL_TOKEN}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Database (production instance, not localhost) ---
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}

# --- Never let Hibernate auto-alter a production schema ---
# "update" is fine for dev/default, but a bug in an entity could silently
# alter or drop a real production column. Use a migration tool (Flyway/
# Liquibase) for real schema changes once this is live; "validate" here means
# the app refuses to start if the schema doesn't already match the entities,
# instead of silently changing production data structure.
spring.jpa.hibernate.ddl-auto=validate

# --- Quieter logs in production - DEBUG/TRACE SQL logging is a dev-only aid ---
logging.level.com.enterprise.ems=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

app.frontend-url=${PROD_FRONTEND_URL}
