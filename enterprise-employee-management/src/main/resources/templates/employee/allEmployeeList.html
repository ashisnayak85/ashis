<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Employees - EEMS')}"></head>
<body>
<nav th:replace="~{layout/fragments :: navbar}"></nav>
<style>
	.active-employee {
	    color: green !important;
	    font-weight: bold;
	}

	.resigned-employee {
	    color: red !important;
	    font-weight: bold;
	}
</style>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Employee Management</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#employeeModal" onclick="openCreateModal()">
            <i class="bi bi-plus"></i> Add Employee
        </button>
    </div>

    <!-- Search bar - triggers AJAX search -->
    <div class="row mb-3">
        <div class="col-md-4">
            <input type="text" id="searchInput" class="form-control" placeholder="Search employees..."/>
        </div>
    </div>

    <!-- Employee table - populated via AJAX -->
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Code</th>
				<th>Name</th>
				<th>Email</th>
				<th>Mobile</th>
                <th>Department</th>
				<th>Designation</th>
				<th>Employee Type</th>
            </tr>
        </thead>
        <tbody id="employeeTableBody"></tbody>
    </table>

    <!-- Pagination - AJAX driven -->
    <nav><ul class="pagination justify-content-center" id="pagination"></ul></nav>
</div>

<!-- Employee Modal - Create/Edit form -->
<div class="modal fade" id="employeeModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Employee</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="employeeForm">
                    <input type="hidden" id="employeeId"/>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Employee Code *</label>
                            <input type="text" id="employeeCode" class="form-control" required pattern="[A-Z0-9]+"/>
                            <div class="invalid-feedback">Uppercase alphanumeric required</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Department *</label>
                            <select id="departmentId" class="form-select" required>
                                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name *</label>
                            <input type="text" id="firstName" class="form-control" required minlength="2"/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name *</label>
                            <input type="text" id="lastName" class="form-control" required minlength="2"/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" id="email" class="form-control" required/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Mobile</label>
                            <input type="text" id="mobile" class="form-control" pattern="[6-9][0-9]{9}"/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date of Joining *</label>
                            <input type="date" id="dateOfJoining" class="form-control" required/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Designation</label>
                            <input type="text" id="designation" class="form-control"/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Salary</label>
                            <input type="number" id="salary" class="form-control" min="0" step="0.01"/>
                        </div>
                    </div>
                    <div id="formErrors" class="alert alert-danger d-none"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveEmployee()">Save</button>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<script th:src="@{/js/allEmployee.js}"></script>
</body>
</html>
