<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Dashboard - EEMS')}"></head>
<body>
<nav th:replace="~{layout/fragments :: navbar}"></nav>

<div class="container mt-4">
    <h2>Dashboard</h2>
    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body">
                    <h5 class="card-title">Total Employees</h5>
                    <p class="card-text display-4" th:text="${stats.totalEmployees}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">Departments</h5>
                    <p class="card-text display-4" th:text="${stats.totalDepartments}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-info mb-3">
                <div class="card-body">
                    <h5 class="card-title">Present Today</h5>
                    <p class="card-text display-4" th:text="${stats.presentToday}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-warning mb-3">
                <div class="card-body">
                    <h5 class="card-title">Pending Leaves</h5>
                    <p class="card-text display-4" th:text="${stats.pendingLeaves}">0</p>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
