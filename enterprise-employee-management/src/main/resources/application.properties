# =============================================================================
# APPLICATION PROPERTIES - Every property explained
# =============================================================================

# --- Application Identity ---
spring.application.name=employee-management-system
# Purpose: Application name used in logs, metrics, and service discovery

server.port=8081
# Purpose: HTTP port for embedded Tomcat (change for production)

server.servlet.context-path=/
# Purpose: Base URL path. Use /eems for WAR deployment on shared Tomcat

# --- Database Configuration (Phase 3) ---
spring.datasource.url=jdbc:mysql://localhost:3306/eems_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Purpose: MySQL connection URL. createDatabaseIfNotExist=true auto-creates DB

spring.datasource.username=root
# Purpose: Database username - CHANGE IN PRODUCTION

spring.datasource.password=root
# Purpose: Database password - CHANGE IN PRODUCTION

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Purpose: JDBC driver class for MySQL Connector/J

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
# Purpose: Auto-create/update tables. Use 'validate' or 'none' in production

spring.jpa.show-sql=true
# Purpose: Log SQL queries to console (disable in production)

spring.jpa.properties.hibernate.format_sql=true
# Purpose: Pretty-print SQL in logs for debugging

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Purpose: Hibernate SQL dialect for MySQL

spring.jpa.open-in-view=false
# Purpose: Disable OSIV anti-pattern - best practice for REST APIs

# --- Thymeleaf Configuration (Phase 2) ---
spring.thymeleaf.cache=false
# Purpose: Disable template caching during development (true in production)

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# --- File Upload Configuration (Phase 9) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
# Purpose: Local directory for storing uploaded files

# --- Mail Configuration (Email Module) ---
# Real SMTP settings live in a profile-specific file so dev/test never touches
# production credentials: application-dev.properties (Mailtrap sandbox) or
# application-prod.properties (real provider, e.g. Zoho ZeptoMail).
# Run with: -Dspring-boot.run.profiles=dev
# Purpose: SMTP settings for account-creation emails. Profile file supplies host/port/credentials.

app.frontend-url=http://localhost:5173

# --- Logging Configuration (Phase 10) ---
logging.level.root=INFO
logging.level.com.enterprise.ems=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Purpose: DEBUG for app code, INFO for framework, TRACE for SQL parameters

# --- Cache Configuration (Phase 11) ---
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30m
# Purpose: In-memory Caffeine cache for departments and employees

# --- Scheduler Configuration ---
app.scheduler.daily-report=0 0 8 * * *
app.scheduler.monthly-report=0 0 9 1 * *
# Purpose: Cron expressions for scheduled reports

# --- Async Configuration ---
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
