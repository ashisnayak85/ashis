# =============================================================================
# OneHealth Clinic Platform - backend config
# Independent app: own port, own database, own JWT secret. Not related to the
# public doctor-appointment-marketplace project.
# =============================================================================

spring.application.name=onehealth-clinic-platform

server.port=8083

# --- Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/onehealth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
# Change this secret before any real deployment. Must be >= 256 bits for HS256.
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-before-deploying-onehealth-32bytes}
app.jwt.access-token-expiry-ms=900000
# 15 minutes
app.jwt.refresh-token-expiry-ms=604800000
# 7 days

# --- CORS ---
app.frontend-url=http://localhost:5175

# --- Platform super-admin (onboards new organizations/clinic-chain customers).
# No public registration endpoint for this role by design. ---
app.superadmin.email=${SUPERADMIN_EMAIL:superadmin@onehealth-platform.com}
app.superadmin.password=${SUPERADMIN_PASSWORD:SuperAdmin@12345}

# --- Demo seed data (first organization + owner), useful for local dev / demo.
# Set app.seed.demo-org=false before a real customer deployment. ---
app.seed.demo-org=true
app.seed.demo-org-name=One Health
app.seed.owner-email=${OWNER_EMAIL:owner@onehealth.com}
app.seed.owner-password=${OWNER_PASSWORD:Owner@12345}

logging.level.root=INFO
logging.level.com.onehealth=DEBUG
