# =============================================================================
# OrgSite Platform - multi-tenant marketing site builder backend
# Every business (tea shop, restaurant, school, ...) is one "Organization" row.
# Public visitors hit /api/public/**  (no login).
# Business owners log in and manage their own content under /api/admin/**.
# =============================================================================

spring.application.name=orgsite-platform
server.port=8083

# --- Database ---
# Using MySQL directly. Run schema.sql once against your MySQL server first
# (creates the orgsite_db database + all tables), then start this app.
spring.datasource.url=jdbc:mysql://localhost:3306/orgsite_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- H2 (only if you want to fall back to zero-setup local testing) ---
# spring.datasource.url=jdbc:h2:mem:orgsite_db;DB_CLOSE_DELAY=-1
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
# update = Hibernate automatically creates missing tables and adds missing
# columns on every startup, based on your @Entity classes. No need to run
# schema.sql manually - this matches how your other projects behave.
# (Note: it only ADDS things; it won't drop/rename columns for you if you
# remove or rename a field in an entity, so occasional manual cleanup is
# still needed for those cases.)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT ---
# Change this secret before any real deployment. Must be >= 256 bits for HS256.
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-before-deploying-orgsite-32bytes}
app.jwt.access-token-expiry-ms=28800000
# 8 hours - admins are business owners logging in occasionally, not needing 15-min tokens
app.jwt.refresh-token-expiry-ms=2592000000
# 30 days

# --- CORS ---
app.frontend-url=http://localhost:5176

# --- File uploads (logos, cover images, gallery photos) ---
# Stored on local disk under this folder and served back at /uploads/**
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Logging ---
logging.level.root=INFO
logging.level.com.orgsite=DEBUG
