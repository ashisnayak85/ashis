# In-memory H2 - zero setup, resets on every restart. Good for evaluating the
# product or running it locally without installing MySQL.
spring.datasource.url=jdbc:h2:mem:ca_practice;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
