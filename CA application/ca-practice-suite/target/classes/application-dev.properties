# Local MySQL - the default dev setup. Requires MySQL running on your machine
# (no schema setup needed - createDatabaseIfNotExist=true creates the database
# and Hibernate creates all tables from the entity classes on first boot).
#
# Defaults assume a fresh local MySQL install (root / no password). Override
# with env vars if yours differs, e.g.:
#   export DB_USERNAME=root
#   export DB_PASSWORD=yourpassword
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ca_practice_suite?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
