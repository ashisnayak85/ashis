spring.application.name=ca-practice-suite

# --- Active profile: 'dev' uses local MySQL (createDatabaseIfNotExist handles
# the schema automatically - just have MySQL running). 'h2' uses in-memory H2
# for a zero-install quick look, but data does not persist across restarts.
spring.profiles.active=dev

server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Seed data (roles, admin user, chart of accounts) on first boot only
app.seed-data=true

# Compliance reminder scheduler
compliance.overdue-check-cron=0 0 6 * * *
